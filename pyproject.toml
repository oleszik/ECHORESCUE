[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echorescue"
version = "0.1.0"
description = "Deterministic search-and-rescue exploration simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EchoRescue contributors" }]
dependencies = []

[project.scripts]
echorescue = "echorescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
