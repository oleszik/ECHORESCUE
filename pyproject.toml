[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echorescue"
version = "0.1.0"
description = "Deterministic search-and-rescue exploration simulation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "EchoRescue contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
]

[project.scripts]
echorescue = "echorescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echorescue = ["dashboard_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src/echorescue"]
exclude = [
    "src[\\\\/]echorescue[\\\\/](?:benchmark|.*_benchmark)\\.py$",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
